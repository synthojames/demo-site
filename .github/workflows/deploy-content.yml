name: Deploy content

on:
  repository_dispatch:
    types: [sanity-publish]

permissions: {}

concurrency:
  group: deploy-content
  cancel-in-progress: false

jobs:
  resolve:
    name: Find last approved release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      sha: ${{ steps.find.outputs.sha }}
    steps:
      - name: Find the commit of the last approved production release
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha=$(gh run list --workflow deploy.yml --event push --branch main --status success --limit 1 --json headSha --jq '.[0].headSha')
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "No approved production release found" >&2
            exit 1
          fi
          echo "Building approved release $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build approved release with new content
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the approved release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies (install scripts disabled)
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Upload site artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: content-publish
    permissions:
      contents: read
    steps:
      - name: Check out the approved release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies (install scripts disabled)
        run: npm ci --ignore-scripts

      - name: Download site artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: dist

      - name: Deploy with Wrangler
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  record:
    name: Record integrity manifest
    needs: [resolve, build, deploy]          # differs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Check out the approved release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}   # differs
          persist-credentials: false

      - name: Download site artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: dist

      - name: Build manifest
        env:
          SHA: ${{ needs.resolve.outputs.sha }}   # differs
        run: bash scripts/make-manifest.sh dist "$SHA" > manifest.json

      - name: Publish manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view integrity-manifest >/dev/null 2>&1 || \
            gh release create integrity-manifest --prerelease --title "Integrity manifest" --notes "Written by the deploy workflows. Do not edit by hand."
          gh release upload integrity-manifest manifest.json --clobber